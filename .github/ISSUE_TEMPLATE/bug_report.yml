name: Báo lỗi
description: Ghi lại lỗi có thể tái hiện
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
      description: Nêu màn hình/API, vai trò đăng nhập và thao tác gây lỗi; dùng dữ liệu giả.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
      description: Kèm ảnh hoặc log đã che thông tin nhạy cảm.
    validations:
      required: true
